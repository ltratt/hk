name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Configure and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev xdotool xvfb

      - name: Configure
        run: autoconf && ./configure

      - name: Run tests
        run: make test
